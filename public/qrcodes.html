<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>QR Codes — Billard</title>
<style>
body { font-family: sans-serif; padding: 20px; background: #f5f5f5; }
h1 { margin-bottom: 20px; font-size: 18px; }
.grid { display: flex; flex-wrap: wrap; gap: 16px; }
.qr-item { background: white; border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.qr-item img { display: block; }
.table-num { font-size: 18px; font-weight: 700; margin-top: 10px; }
.url { font-size: 10px; color: #999; margin-top: 4px; }
button { padding: 10px 20px; background: #ff6b35; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; margin-bottom: 20px; }
</style>
</head>
<body>
<h1>QR Codes — File d'attente Billard</h1>
<p style="margin-bottom:16px;color:#666;font-size:14px">Imprimez cette page et collez un QR code sur chaque table.</p>
<button onclick="window.print()">🖨️ Imprimer</button>
<div class="grid" id="grid"></div>

<script>
// ⚙️ MODIFIEZ ICI : nombre de tables et URL de votre serveur
const NUM_TABLES = 20;
const BASE_URL = window.location.origin; // automatique

const grid = document.getElementById('grid');

for (let i = 1; i <= NUM_TABLES; i++) {
  const url = `${BASE_URL}/table/${i}`;
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(url)}`;
  
  const div = document.createElement('div');
  div.className = 'qr-item';
  div.innerHTML = `
    <img src="${qrUrl}" width="160" height="160" alt="QR Table ${i}">
    <div class="table-num">Table ${i}</div>
    <div class="url">${url}</div>
  `;
  grid.appendChild(div);
}
</script>
</body>
</html>
